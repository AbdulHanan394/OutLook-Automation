services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: email_finder
      POSTGRES_USER: email_finder
      POSTGRES_PASSWORD: email_finder
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U email_finder -d email_finder"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [postgres_data:/var/lib/postgresql/data]
  migrate:
    build: ./backend
    command: alembic upgrade head
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
  api:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
    ports: ["8001:8000"]
  worker:
    build: ./backend
    command: python -m app.worker.runner
    env_file: .env
    depends_on:
      migrate: { condition: service_completed_successfully }
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8001
    environment: [NEXT_PUBLIC_API_BASE_URL=http://localhost:8001]
    depends_on: [api]
    ports: ["3001:3000"]
volumes:
  postgres_data:
