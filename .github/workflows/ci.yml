name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: email_finder, POSTGRES_USER: email_finder, POSTGRES_PASSWORD: email_finder }
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U email_finder" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install './backend[dev]'
      # Run from backend/ so the strict settings in backend/pyproject.toml apply;
      # invoking mypy from the repo root silently fell back to its defaults.
      - run: ruff check .
        working-directory: backend
      - run: mypy app
        working-directory: backend
      - run: pytest
        working-directory: backend
        env:
          # Enables the Postgres integration tests in tests/integration and
          # tests/unit/test_fts_postgres.py, which execute the assistant
          # retrieval SQL instead of only compiling it.
          TEST_DATABASE_URL: postgresql+psycopg://email_finder:email_finder@localhost:5432/email_finder
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend