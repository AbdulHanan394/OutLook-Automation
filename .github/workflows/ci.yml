name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: email_finder, POSTGRES_USER: email_finder, POSTGRES_PASSWORD: email_finder }
        ports: [5432:5432]
        options: >- --health-cmd "pg_isready -U email_finder" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install './backend[dev]'
      - run: ruff check backend && mypy backend/app
      - run: cd backend && pytest
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd frontend && npm install && npm run build
